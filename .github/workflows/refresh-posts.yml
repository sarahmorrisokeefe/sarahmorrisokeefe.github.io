name: Refresh post teasers

on:
  schedule:
    - cron: '0 11 * * *' # daily at 11:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: refresh-posts
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run posts:refresh

      - name: Open PR with refreshed data if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet src/data/posts.generated.json; then
            echo "No feed changes."
            exit 0
          fi

          branch="posts-refresh"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add src/data/posts.generated.json
          git commit -m "chore: refresh post teasers from feeds"
          git push --force origin "$branch"

          existing_pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          if [ -z "$existing_pr" ]; then
            gh pr create \
              --title "chore: refresh post teasers from feeds" \
              --body "Automated daily refresh of post teasers from Medium/Substack feeds." \
              --base master \
              --head "$branch"
          fi

          gh pr merge "$branch" --auto --squash

          # Events from GITHUB_TOKEN don't trigger workflows, except workflow_dispatch,
          # so start the CodeQL check that branch protection requires.
          gh workflow run codeql-analysis.yml --ref "$branch"
